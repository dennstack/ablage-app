appId: de.dennstack.ablage
productName: Ablage
directories:
  buildResources: build
files:
  - out/**
  - package.json
extraResources:
  - from: resources/categories.yaml
    to: categories.yaml
win:
  icon: build/icon.ico
  # nsis needs wine on Linux/WSL; portable and zip do not
  target:
    - portable
    - zip
mac:
  icon: build/icon.png
  category: public.app-category.productivity
  target:
    - target: dmg
      arch:
        - x64
        - arm64
linux:
  icon: build/icon.png
  category: Office
  target:
    - AppImage
    - tar.gz
portable:
  artifactName: ${productName}-${version}-portable.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  artifactName: ${productName}-Setup-${version}.${ext}
